services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: teamdesk
      POSTGRES_USER: teamdesk
      POSTGRES_PASSWORD: teamdesk
    ports:
      - "5432:5432"
    volumes:
      - teamdesk-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamdesk -d teamdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  teamdesk-postgres:
